spring:
  application:
    name: todo
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ndev}
    username: ${DB_USER:ndev}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        type:
          preferred_instant_jdbc_type: TIMESTAMP_UTC

server:
  port: 8080

ndev:
  api-key: ${NDEV_API_KEY}
